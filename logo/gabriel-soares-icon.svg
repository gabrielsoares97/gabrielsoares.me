<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Soares GS achievement badge</title>
  <desc id="desc">A neo-brutalist flat vector badge with a GS monogram.</desc>
  <rect width="512" height="512" rx="48" fill="#DBE5FF"/>
  <!-- hard offset shadow -->
  <path d="M256 47 438 152v208L256 465 74 360V152Z" fill="#1A1446" stroke="#1A1446" stroke-width="18" stroke-linejoin="round" transform="translate(14 16)"/>
  <!-- badge -->
  <path d="M256 47 438 152v208L256 465 74 360V152Z" fill="#FFC531" stroke="#1A1446" stroke-width="18" stroke-linejoin="round"/>
  <!-- inner badge panel -->
  <path d="M256 94 397 175v162l-141 81-141-81V175Z" fill="#DBE5FF" stroke="#1A1446" stroke-width="12" stroke-linejoin="round"/>
  <!-- pixel spark -->
  <path d="M371 112h16v16h16v16h-16v16h-16v-16h-16v-16h16Z" fill="#17A35F" stroke="#1A1446" stroke-width="8" stroke-linejoin="round"/>
  <!-- monogram -->
  <text x="256" y="335" text-anchor="middle" fill="#1A1446" font-family="Bricolage Grotesque, Arial Rounded MT Bold, Arial, sans-serif" font-size="190" font-weight="900" letter-spacing="-18">GS</text>
  <!-- small achievement ticks -->
  <path d="M122 212h22M368 212h22M122 300h22M368 300h22" stroke="#FF5A6E" stroke-width="10" stroke-linecap="round"/>
</svg>
